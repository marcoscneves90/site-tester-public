name: site-tester-public

services:
  postgres:
    image: postgres:16-alpine
    container_name: site-tester-public-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      CRAWL_MAX_PAGES: 10
      CRAWL_CONCURRENCY: 3
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: site-tester-public-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: site-tester-public-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      LIGHTHOUSE_TIMEOUT_MS: 90000
      LIGHTHOUSE_CONCURRENCY: 2
      FAVICON_DIR: /app/data/favicons
      USER_NAME: ${USER_NAME}
      PUBLIC_URL: ${PUBLIC_URL}  
    ports:
      - "9014:3000"
    volumes:
      - ./data/favicons:/app/data/favicons
    shm_size: "1gb"
