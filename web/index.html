<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Básico -->
    <title>Site Tester — Auditoria de SEO e Performance</title>
    <meta
      name="description"
      content="Ferramenta de auditoria SEO e performance de sites. Análise de Open Graph, Twitter Cards, structured data, Core Web Vitals e recomendações acionáveis."
    />
    <meta name="author" content="Marcos Neves" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph (URLs e imagens preenchidas dinamicamente via publicUrl) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Site Tester — Auditoria de SEO e Performance" />
    <meta
      property="og:description"
      content="Analise SEO, performance e acessibilidade de qualquer site."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:url" content="/" />
    <meta property="og:site_name" content="Site Tester" />
    <meta property="og:locale" content="pt_BR" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Site Tester — Auditoria de SEO e Performance" />
    <meta
      name="twitter:description"
      content="Analise SEO, performance e acessibilidade de qualquer site."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Favicons -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="alternate icon" href="/favicon.ico" />

    <!-- Canonical (preenchido dinamicamente) -->
    <link rel="canonical" href="/" />

    <!-- Tema / PWA básico -->
    <meta name="theme-color" content="#8b5cf6" />

    <!-- Fontes — carregamento não-bloqueante -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap"
      />
    </noscript>

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Site Tester",
        "description": "Ferramenta de auditoria SEO e performance de sites",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Web",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "BRL"
        },
        "author": {
          "@type": "Person",
          "name": "Marcos Neves"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
